[project]
name = "zipclaw"
version = "0.1.0"
description = "使用 Python 实现的学习型编程智能体，支持连续对话和文件工具。"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "openai>=3.19.2",
    "pydantic>=2.13.5",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
zipclaw = "zipclaw.cli:entrypoint"
