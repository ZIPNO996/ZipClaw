[project]
name = "zipclaw"
version = "0.1.0"
description = "使用 Python 实现的学习型编程智能体，支持连续对话和文件工具。"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "httpx>=0.28.1",
    "openai>=3.19.2",
    "pillow>=11.0.0",
    "pydantic>=2.13.5",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
zipclaw = "zipclaw.cli:entrypoint"
zipclaw-wechat = "zipclaw.channels.wechat.main:entrypoint"

[project.optional-dependencies]
wechat = [
    "httpx>=0.28.1",
    "qrcode>=8.2",
    "cryptography>=43.0.0",
    "pillow>=11.0.0",
]
